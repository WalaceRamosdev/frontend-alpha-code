<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="40%" style="stop-color:#0f2847"/>
      <stop offset="100%" style="stop-color:#1a3a5c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4a90d9"/>
      <stop offset="100%" style="stop-color:#6bb3f0"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="30%">
      <stop offset="0%" style="stop-color:#4a90d9;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#4a90d9;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%">
      <stop offset="0%" style="stop-color:#6bb3f0;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#6bb3f0;stop-opacity:0"/>
    </radialGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="80"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="120"/></filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- Ambient glows -->
  <ellipse cx="384" cy="324" rx="500" ry="400" fill="#4a90d9" opacity="0.06" filter="url(#blur2)"/>
  <ellipse cx="1536" cy="756" rx="400" ry="350" fill="#6bb3f0" opacity="0.04" filter="url(#blur2)"/>

  <!-- Geometric grid pattern -->
  <g opacity="0.04" stroke="#4a90d9" stroke-width="1" fill="none">
    <line x1="0" y1="180" x2="1920" y2="180"/>
    <line x1="0" y1="360" x2="1920" y2="360"/>
    <line x1="0" y1="540" x2="1920" y2="540"/>
    <line x1="0" y1="720" x2="1920" y2="720"/>
    <line x1="0" y1="900" x2="1920" y2="900"/>
    <line x1="320" y1="0" x2="320" y2="1080"/>
    <line x1="640" y1="0" x2="640" y2="1080"/>
    <line x1="960" y1="0" x2="960" y2="1080"/>
    <line x1="1280" y1="0" x2="1280" y2="1080"/>
    <line x1="1600" y1="0" x2="1600" y2="1080"/>
  </g>

  <!-- Floating books -->
  <g opacity="0.08">
    <rect x="150" y="200" width="80" height="60" rx="4" fill="#4a90d9" transform="rotate(-15 190 230)"/>
    <rect x="155" y="205" width="70" height="50" rx="2" fill="#0f2847" transform="rotate(-15 190 230)"/>
    <line x1="190" y1="205" x2="190" y2="255" stroke="#4a90d9" stroke-width="1" transform="rotate(-15 190 230)"/>

    <rect x="1650" y="650" width="90" height="65" rx="4" fill="#6bb3f0" transform="rotate(10 1695 682)"/>
    <rect x="1655" y="655" width="80" height="55" rx="2" fill="#0f2847" transform="rotate(10 1695 682)"/>
    <line x1="1695" y1="655" x2="1695" y2="710" stroke="#6bb3f0" stroke-width="1" transform="rotate(10 1695 682)"/>

    <rect x="400" y="750" width="70" height="55" rx="4" fill="#4a90d9" transform="rotate(8 435 777)"/>
    <rect x="405" y="755" width="60" height="45" rx="2" fill="#0f2847" transform="rotate(8 435 777)"/>

    <rect x="1400" y="150" width="75" height="58" rx="4" fill="#6bb3f0" transform="rotate(-8 1437 179)"/>
    <rect x="1405" y="155" width="65" height="48" rx="2" fill="#0f2847" transform="rotate(-8 1437 179)"/>
  </g>

  <!-- Graduation cap silhouette -->
  <g opacity="0.06" transform="translate(960, 540) scale(1.5)">
    <polygon points="0,-80 -100,0 0,-30 100,0" fill="#4a90d9"/>
    <polygon points="-100,0 0,30 100,0 0,-30" fill="#3a7bc8"/>
    <rect x="-8" y="0" width="16" height="50" fill="#4a90d9"/>
    <circle cx="0" cy="55" r="8" fill="#6bb3f0"/>
    <line x1="8" y1="55" x2="30" y2="80" stroke="#6bb3f0" stroke-width="2"/>
    <circle cx="30" cy="82" r="4" fill="#6bb3f0"/>
  </g>

  <!-- Floating dots/particles -->
  <g opacity="0.12">
    <circle cx="200" cy="400" r="3" fill="#4a90d9"/>
    <circle cx="350" cy="250" r="2" fill="#6bb3f0"/>
    <circle cx="500" cy="600" r="4" fill="#4a90d9"/>
    <circle cx="700" cy="150" r="2.5" fill="#6bb3f0"/>
    <circle cx="850" cy="800" r="3" fill="#4a90d9"/>
    <circle cx="1100" cy="300" r="2" fill="#6bb3f0"/>
    <circle cx="1250" cy="700" r="3.5" fill="#4a90d9"/>
    <circle cx="1450" cy="450" r="2.5" fill="#6bb3f0"/>
    <circle cx="1600" cy="200" r="3" fill="#4a90d9"/>
    <circle cx="1750" cy="550" r="2" fill="#6bb3f0"/>
    <circle cx="300" cy="850" r="2" fill="#4a90d9"/>
    <circle cx="1650" cy="900" r="3" fill="#6bb3f0"/>
  </g>

  <!-- Subtle hexagon pattern -->
  <g opacity="0.03" stroke="#4a90d9" stroke-width="1" fill="none">
    <polygon points="960,100 1020,130 1020,190 960,220 900,190 900,130"/>
    <polygon points="1080,170 1140,200 1140,260 1080,290 1020,260 1020,200"/>
    <polygon points="840,170 900,200 900,260 840,290 780,260 780,200"/>
  </g>

  <!-- Bottom wave -->
  <path d="M0,950 Q480,880 960,920 Q1440,960 1920,900 L1920,1080 L0,1080 Z" fill="#0a1628" opacity="0.5"/>
  <path d="M0,980 Q480,930 960,960 Q1440,990 1920,940 L1920,1080 L0,1080 Z" fill="#0a1628" opacity="0.3"/>
</svg>