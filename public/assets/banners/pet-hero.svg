<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0a1e"/>
      <stop offset="40%" style="stop-color:#1a1230"/>
      <stop offset="100%" style="stop-color:#251a40"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="100"/></filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- Purple ambient glow -->
  <ellipse cx="500" cy="400" rx="500" ry="400" fill="#8b5cf6" opacity="0.06" filter="url(#blur1)"/>
  <ellipse cx="1400" cy="650" rx="400" ry="350" fill="#a78bfa" opacity="0.04" filter="url(#blur1)"/>

  <!-- Large paw print - center -->
  <g opacity="0.06" fill="#8b5cf6" transform="translate(960, 480) scale(2)">
    <!-- Main pad -->
    <ellipse cx="0" cy="20" rx="45" ry="35"/>
    <!-- Toe pads -->
    <ellipse cx="-35" cy="-25" rx="18" ry="22" transform="rotate(-15 -35 -25)"/>
    <ellipse cx="-10" cy="-40" rx="16" ry="20"/>
    <ellipse cx="18" cy="-38" rx="16" ry="20"/>
    <ellipse cx="38" cy="-22" rx="17" ry="21" transform="rotate(15 38 -22)"/>
  </g>

  <!-- Smaller paw prints scattered -->
  <g opacity="0.04" fill="#a78bfa">
    <!-- Paw 1 - top left -->
    <g transform="translate(250, 250) scale(0.6) rotate(-20)">
      <ellipse cx="0" cy="20" rx="45" ry="35"/>
      <ellipse cx="-35" cy="-25" rx="18" ry="22"/>
      <ellipse cx="-10" cy="-40" rx="16" ry="20"/>
      <ellipse cx="18" cy="-38" rx="16" ry="20"/>
      <ellipse cx="38" cy="-22" rx="17" ry="21"/>
    </g>
    <!-- Paw 2 - top right -->
    <g transform="translate(1650, 200) scale(0.5) rotate(15)">
      <ellipse cx="0" cy="20" rx="45" ry="35"/>
      <ellipse cx="-35" cy="-25" rx="18" ry="22"/>
      <ellipse cx="-10" cy="-40" rx="16" ry="20"/>
      <ellipse cx="18" cy="-38" rx="16" ry="20"/>
      <ellipse cx="38" cy="-22" rx="17" ry="21"/>
    </g>
    <!-- Paw 3 - bottom left -->
    <g transform="translate(400, 800) scale(0.55) rotate(-10)">
      <ellipse cx="0" cy="20" rx="45" ry="35"/>
      <ellipse cx="-35" cy="-25" rx="18" ry="22"/>
      <ellipse cx="-10" cy="-40" rx="16" ry="20"/>
      <ellipse cx="18" cy="-38" rx="16" ry="20"/>
      <ellipse cx="38" cy="-22" rx="17" ry="21"/>
    </g>
    <!-- Paw 4 - bottom right -->
    <g transform="translate(1500, 750) scale(0.45) rotate(25)">
      <ellipse cx="0" cy="20" rx="45" ry="35"/>
      <ellipse cx="-35" cy="-25" rx="18" ry="22"/>
      <ellipse cx="-10" cy="-40" rx="16" ry="20"/>
      <ellipse cx="18" cy="-38" rx="16" ry="20"/>
      <ellipse cx="38" cy="-22" rx="17" ry="21"/>
    </g>
  </g>

  <!-- Heart shapes -->
  <g opacity="0.05" fill="#8b5cf6">
    <path d="M300,400 C300,380 280,360 260,360 C240,360 220,380 220,400 C220,430 300,470 300,470 C300,470 380,430 380,400 C380,380 360,360 340,360 C320,360 300,380 300,400 Z" transform="scale(0.6) translate(200, 200)"/>
    <path d="M300,400 C300,380 280,360 260,360 C240,360 220,380 220,400 C220,430 300,470 300,470 C300,470 380,430 380,400 C380,380 360,360 340,360 C320,360 300,380 300,400 Z" transform="scale(0.5) translate(2800, 500)"/>
    <path d="M300,400 C300,380 280,360 260,360 C240,360 220,380 220,400 C220,430 300,470 300,470 C300,470 380,430 380,400 C380,380 360,360 340,360 C320,360 300,380 300,400 Z" transform="scale(0.4) translate(900, 1400)"/>
  </g>

  <!-- Playful curved lines -->
  <g opacity="0.04" stroke="#8b5cf6" stroke-width="1.5" fill="none">
    <path d="M100,600 Q300,500 500,600 T900,550"/>
    <path d="M1020,500 Q1220,400 1420,500 T1820,450"/>
    <path d="M200,800 Q400,750 600,820"/>
    <path d="M1320,780 Q1520,720 1720,800"/>
  </g>

  <!-- Particles -->
  <g opacity="0.1">
    <circle cx="200" cy="300" r="2.5" fill="#8b5cf6"/>
    <circle cx="450" cy="180" r="2" fill="#a78bfa"/>
    <circle cx="700" cy="500" r="3" fill="#8b5cf6"/>
    <circle cx="850" cy="120" r="2" fill="#a78bfa"/>
    <circle cx="1100" cy="650" r="2.5" fill="#8b5cf6"/>
    <circle cx="1300" cy="220" r="2" fill="#a78bfa"/>
    <circle cx="1500" cy="550" r="3" fill="#8b5cf6"/>
    <circle cx="1700" cy="350" r="2" fill="#a78bfa"/>
    <circle cx="300" cy="700" r="2" fill="#8b5cf6"/>
    <circle cx="1600" cy="850" r="2.5" fill="#a78bfa"/>
  </g>

  <!-- Bottom wave -->
  <path d="M0,940 Q480,890 960,920 Q1440,950 1920,900 L1920,1080 L0,1080 Z" fill="#0f0a1e" opacity="0.5"/>
</svg>