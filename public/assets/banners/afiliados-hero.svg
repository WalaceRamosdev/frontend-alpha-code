<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1e"/>
      <stop offset="40%" style="stop-color:#0f1a30"/>
      <stop offset="100%" style="stop-color:#142540"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#007bff"/>
      <stop offset="100%" style="stop-color:#00a8ff"/>
    </linearGradient>
    <linearGradient id="growth" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#007bff;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#00ff88;stop-opacity:0.8"/>
    </linearGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="100"/></filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- Blue ambient glow -->
  <ellipse cx="500" cy="400" rx="500" ry="400" fill="#007bff" opacity="0.06" filter="url(#blur1)"/>
  <ellipse cx="1400" cy="650" rx="400" ry="350" fill="#00a8ff" opacity="0.04" filter="url(#blur1)"/>

  <!-- Rising bar chart - growth metaphor -->
  <g opacity="0.06">
    <rect x="200" y="700" width="40" height="200" fill="#007bff" rx="4"/>
    <rect x="260" y="600" width="40" height="300" fill="#0088ff" rx="4"/>
    <rect x="320" y="500" width="40" height="400" fill="#0099ff" rx="4"/>
    <rect x="380" y="400" width="40" height="500" fill="#00aaff" rx="4"/>
    <rect x="440" y="300" width="40" height="600" fill="#00bbff" rx="4"/>
  </g>

  <!-- Rising arrow -->
  <g opacity="0.06" stroke="#00ff88" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M200,750 Q400,500 600,400 T1000,250 T1500,150"/>
    <polygon points="1500,150 1470,170 1490,180" fill="#00ff88" stroke="none"/>
  </g>

  <!-- Network/connection nodes -->
  <g opacity="0.05" stroke="#007bff" stroke-width="1" fill="none">
    <!-- Node cluster 1 -->
    <circle cx="800" cy="400" r="30"/>
    <circle cx="800" cy="400" r="5"/>
    <circle cx="700" cy="350" r="20"/>
    <circle cx="700" cy="350" r="4"/>
    <circle cx="900" cy="350" r="20"/>
    <circle cx="900" cy="350" r="4"/>
    <circle cx="750" cy="500" r="18"/>
    <circle cx="750" cy="500" r="3"/>
    <circle cx="880" cy="480" r="22"/>
    <circle cx="880" cy="480" r="4"/>
    <line x1="800" y1="400" x2="700" y2="350"/>
    <line x1="800" y1="400" x2="900" y2="350"/>
    <line x1="800" y1="400" x2="750" y2="500"/>
    <line x1="800" y1="400" x2="880" y2="480"/>
    <line x1="700" y1="350" x2="750" y2="500"/>
    <line x1="900" y1="350" x2="880" y2="480"/>

    <!-- Node cluster 2 -->
    <circle cx="1200" cy="500" r="25"/>
    <circle cx="1200" cy="500" r="4"/>
    <circle cx="1120" cy="450" r="18"/>
    <circle cx="1120" cy="450" r="3"/>
    <circle cx="1300" cy="440" r="20"/>
    <circle cx="1300" cy="440" r="4"/>
    <circle cx="1250" cy="580" r="16"/>
    <circle cx="1250" cy="580" r="3"/>
    <line x1="1200" y1="500" x2="1120" y2="450"/>
    <line x1="1200" y1="500" x2="1300" y2="440"/>
    <line x1="1200" y1="500" x2="1250" y2="580"/>
  </g>

  <!-- Digital rain / data streams -->
  <g opacity="0.03" fill="#00a8ff">
    <rect x="600" y="100" width="2" height="60" rx="1"/>
    <rect x="600" y="180" width="2" height="40" rx="1"/>
    <rect x="650" y="140" width="2" height="50" rx="1"/>
    <rect x="700" y="80" width="2" height="70" rx="1"/>
    <rect x="1100" y="120" width="2" height="55" rx="1"/>
    <rect x="1150" y="90" width="2" height="65" rx="1"/>
    <rect x="1200" y="160" width="2" height="45" rx="1"/>
    <rect x="1400" y="100" width="2" height="60" rx="1"/>
    <rect x="1450" y="150" width="2" height="50" rx="1"/>
  </g>

  <!-- Dollar/coins -->
  <g opacity="0.04" fill="#00ff88">
    <circle cx="1600" cy="300" r="25" stroke="#00ff88" stroke-width="1.5" fill="none"/>
    <text x="1600" y="308" font-family="Arial,sans-serif" font-size="20" fill="#00ff88" text-anchor="middle">$</text>
    <circle cx="1660" cy="260" r="20" stroke="#00ff88" stroke-width="1" fill="none"/>
    <text x="1660" y="267" font-family="Arial,sans-serif" font-size="16" fill="#00ff88" text-anchor="middle">$</text>
  </g>

  <!-- Particles -->
  <g opacity="0.1">
    <circle cx="200" cy="300" r="2.5" fill="#007bff"/>
    <circle cx="450" cy="180" r="2" fill="#00a8ff"/>
    <circle cx="700" cy="500" r="3" fill="#007bff"/>
    <circle cx="850" cy="120" r="2" fill="#00a8ff"/>
    <circle cx="1100" cy="650" r="2.5" fill="#007bff"/>
    <circle cx="1300" cy="220" r="2" fill="#00a8ff"/>
    <circle cx="1500" cy="550" r="3" fill="#007bff"/>
    <circle cx="1700" cy="350" r="2" fill="#00a8ff"/>
    <circle cx="300" cy="700" r="2" fill="#00ff88"/>
    <circle cx="1600" cy="800" r="2.5" fill="#00ff88"/>
  </g>

  <!-- Bottom wave -->
  <path d="M0,940 Q480,890 960,920 Q1440,950 1920,900 L1920,1080 L0,1080 Z" fill="#0a0f1e" opacity="0.5"/>
</svg>