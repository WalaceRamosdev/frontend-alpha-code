<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1510"/>
      <stop offset="40%" style="stop-color:#2e2518"/>
      <stop offset="100%" style="stop-color:#3d3020"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d4af37"/>
      <stop offset="50%" style="stop-color:#f0d060"/>
      <stop offset="100%" style="stop-color:#d4af37"/>
    </linearGradient>
    <linearGradient id="gold2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b8962e"/>
      <stop offset="100%" style="stop-color:#d4af37"/>
    </linearGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="100"/></filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- Gold ambient glow -->
  <ellipse cx="480" cy="400" rx="500" ry="400" fill="#d4af37" opacity="0.05" filter="url(#blur1)"/>
  <ellipse cx="1440" cy="650" rx="400" ry="350" fill="#f0d060" opacity="0.03" filter="url(#blur1)"/>

  <!-- City skyline silhouette -->
  <g opacity="0.06" fill="#d4af37">
    <!-- Buildings -->
    <rect x="100" y="600" width="60" height="480"/>
    <rect x="170" y="500" width="50" height="580"/>
    <rect x="230" y="550" width="70" height="530"/>
    <rect x="310" y="450" width="55" height="630"/>
    <rect x="375" y="520" width="65" height="560"/>
    <rect x="450" y="400" width="80" height="680"/>
    <rect x="540" y="480" width="60" height="600"/>
    <rect x="610" y="350" width="70" height="730"/>
    <rect x="690" y="420" width="55" height="660"/>
    <rect x="755" y="500" width="75" height="580"/>

    <rect x="1100" y="480" width="65" height="600"/>
    <rect x="1175" y="380" width="75" height="700"/>
    <rect x="1260" y="440" width="60" height="640"/>
    <rect x="1330" y="350" width="85" height="730"/>
    <rect x="1425" y="420" width="70" height="660"/>
    <rect x="1505" y="500" width="60" height="580"/>
    <rect x="1575" y="380" width="75" height="700"/>
    <rect x="1660" y="460" width="65" height="620"/>
    <rect x="1735" y="520" width="80" height="560"/>
  </g>

  <!-- Building windows -->
  <g opacity="0.04" fill="#f0d060">
    <rect x="460" y="420" width="8" height="8" rx="1"/>
    <rect x="480" y="420" width="8" height="8" rx="1"/>
    <rect x="500" y="420" width="8" height="8" rx="1"/>
    <rect x="460" y="445" width="8" height="8" rx="1"/>
    <rect x="480" y="445" width="8" height="8" rx="1"/>
    <rect x="500" y="445" width="8" height="8" rx="1"/>
    <rect x="460" y="470" width="8" height="8" rx="1"/>
    <rect x="480" y="470" width="8" height="8" rx="1"/>
    <rect x="500" y="470" width="8" height="8" rx="1"/>

    <rect x="1340" y="370" width="8" height="8" rx="1"/>
    <rect x="1365" y="370" width="8" height="8" rx="1"/>
    <rect x="1390" y="370" width="8" height="8" rx="1"/>
    <rect x="1340" y="395" width="8" height="8" rx="1"/>
    <rect x="1365" y="395" width="8" height="8" rx="1"/>
    <rect x="1390" y="395" width="8" height="8" rx="1"/>
  </g>

  <!-- Gold geometric accents -->
  <g opacity="0.05" stroke="#d4af37" stroke-width="1" fill="none">
    <polygon points="960,200 1040,320 960,440 880,320"/>
    <polygon points="960,260 1010,340 960,420 910,340"/>
    <line x1="960" y1="200" x2="960" y2="440"/>
    <line x1="880" y1="320" x2="1040" y2="320"/>
  </g>

  <!-- Perspective lines - depth -->
  <g opacity="0.03" stroke="#d4af37" stroke-width="0.5">
    <line x1="960" y1="540" x2="0" y2="1080"/>
    <line x1="960" y1="540" x2="1920" y2="1080"/>
    <line x1="960" y1="540" x2="0" y2="0"/>
    <line x1="960" y1="540" x2="1920" y2="0"/>
    <line x1="960" y1="540" x2="480" y2="1080"/>
    <line x1="960" y1="540" x2="1440" y2="1080"/>
  </g>

  <!-- Particles -->
  <g opacity="0.1">
    <circle cx="200" cy="350" r="2.5" fill="#d4af37"/>
    <circle cx="450" cy="200" r="2" fill="#f0d060"/>
    <circle cx="700" cy="500" r="3" fill="#d4af37"/>
    <circle cx="900" cy="150" r="2" fill="#f0d060"/>
    <circle cx="1100" cy="650" r="2.5" fill="#d4af37"/>
    <circle cx="1300" cy="250" r="2" fill="#f0d060"/>
    <circle cx="1500" cy="550" r="3" fill="#d4af37"/>
    <circle cx="1700" cy="350" r="2" fill="#f0d060"/>
    <circle cx="350" cy="750" r="2" fill="#d4af37"/>
    <circle cx="1600" cy="800" r="2.5" fill="#f0d060"/>
  </g>

  <!-- Bottom gradient -->
  <path d="M0,940 Q480,890 960,920 Q1440,950 1920,900 L1920,1080 L0,1080 Z" fill="#1a1510" opacity="0.5"/>
</svg>