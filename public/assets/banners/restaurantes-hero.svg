<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0f08"/>
      <stop offset="40%" style="stop-color:#2e1a0f"/>
      <stop offset="100%" style="stop-color:#3d2515"/>
    </linearGradient>
    <linearGradient id="flame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b35"/>
      <stop offset="50%" style="stop-color:#ff8c42"/>
      <stop offset="100%" style="stop-color:#ffb347"/>
    </linearGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="100"/></filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- Warm ambient glow -->
  <ellipse cx="500" cy="400" rx="500" ry="400" fill="#ff6b35" opacity="0.06" filter="url(#blur1)"/>
  <ellipse cx="1400" cy="650" rx="400" ry="350" fill="#ff8c42" opacity="0.04" filter="url(#blur1)"/>

  <!-- Fork and knife silhouette -->
  <g opacity="0.06" fill="#ff6b35" transform="translate(960, 450)">
    <!-- Fork -->
    <g transform="translate(-40, 0)">
      <rect x="-3" y="-120" width="6" height="180" rx="3"/>
      <rect x="-12" y="-120" width="5" height="50" rx="2"/>
      <rect x="-2" y="-120" width="5" height="50" rx="2"/>
      <rect x="8" y="-120" width="5" height="50" rx="2"/>
    </g>
    <!-- Knife -->
    <g transform="translate(40, 0)">
      <rect x="-3" y="-120" width="6" height="180" rx="3"/>
      <path d="M-3,-120 Q-20,-80 -3,-30 L3,-30 Q20,-80 3,-120 Z"/>
    </g>
  </g>

  <!-- Plate circle -->
  <g opacity="0.04" stroke="#ff6b35" stroke-width="2" fill="none">
    <circle cx="960" cy="500" r="200"/>
    <circle cx="960" cy="500" r="180"/>
    <circle cx="960" cy="500" r="160"/>
  </g>

  <!-- Steam/aroma lines -->
  <g opacity="0.05" stroke="#ff8c42" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M880,280 Q870,240 890,200 Q910,160 890,120"/>
    <path d="M940,260 Q930,220 950,180 Q970,140 950,100"/>
    <path d="M1000,270 Q990,230 1010,190 Q1030,150 1010,110"/>
    <path d="M1060,285 Q1050,245 1070,205 Q1090,165 1070,125"/>
  </g>

  <!-- Scattered herbs/leaves -->
  <g opacity="0.05" fill="#ff6b35">
    <ellipse cx="300" cy="350" rx="20" ry="8" transform="rotate(-30 300 350)"/>
    <ellipse cx="310" cy="340" rx="18" ry="7" transform="rotate(-50 310 340)"/>
    <ellipse cx="1600" cy="700" rx="22" ry="9" transform="rotate(25 1600 700)"/>
    <ellipse cx="1615" cy="685" rx="19" ry="7" transform="rotate(45 1615 685)"/>
    <ellipse cx="450" cy="750" rx="18" ry="7" transform="rotate(-15 450 750)"/>
    <ellipse cx="1500" cy="250" rx="20" ry="8" transform="rotate(35 1500 250)"/>
  </g>

  <!-- Warm dots pattern -->
  <g opacity="0.04" fill="#ffb347">
    <circle cx="200" cy="200" r="3"/>
    <circle cx="400" cy="150" r="2"/>
    <circle cx="600" cy="300" r="4"/>
    <circle cx="800" cy="100" r="2.5"/>
    <circle cx="1100" cy="250" r="3"/>
    <circle cx="1300" cy="180" r="2"/>
    <circle cx="1500" cy="350" r="3.5"/>
    <circle cx="1700" cy="200" r="2.5"/>
    <circle cx="300" cy="600" r="2"/>
    <circle cx="1650" cy="550" r="3"/>
    <circle cx="500" cy="850" r="2.5"/>
    <circle cx="1400" cy="800" r="2"/>
  </g>

  <!-- Decorative border lines -->
  <g opacity="0.03" stroke="#ff6b35" stroke-width="0.5">
    <line x1="100" y1="100" x2="300" y2="100"/>
    <line x1="100" y1="100" x2="100" y2="300"/>
    <line x1="1820" y1="100" x2="1620" y2="100"/>
    <line x1="1820" y1="100" x2="1820" y2="300"/>
    <line x1="100" y1="980" x2="300" y2="980"/>
    <line x1="100" y1="980" x2="100" y2="780"/>
    <line x1="1820" y1="980" x2="1620" y2="980"/>
    <line x1="1820" y1="980" x2="1820" y2="780"/>
  </g>

  <!-- Bottom warm wave -->
  <path d="M0,940 Q480,890 960,920 Q1440,950 1920,900 L1920,1080 L0,1080 Z" fill="#1a0f08" opacity="0.5"/>
</svg>